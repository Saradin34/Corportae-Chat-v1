services:
  db:
    image: postgres:16-alpine
    container_name: cc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatpass}
      POSTGRES_DB: ${POSTGRES_DB:-corporate_chat}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chat} -d ${POSTGRES_DB:-corporate_chat}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ccnet]

  redis:
    image: redis:7-alpine
    container_name: cc_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ccnet]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cc_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chat}:${POSTGRES_PASSWORD:-chatpass}@db:5432/${POSTGRES_DB:-corporate_chat}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-please-change-this-to-a-long-random-secret-string-123456}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@corporate.chat}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345!}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # ---- Auth mode ----
      ALLOW_LOCAL_AUTH: ${ALLOW_LOCAL_AUTH:-true}
      # ---- Active Directory / LDAP ----
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
      LDAP_SERVERS: ${LDAP_SERVERS:-ldap://dc.company.local:389}
      LDAP_USE_SSL: ${LDAP_USE_SSL:-false}
      LDAP_START_TLS: ${LDAP_START_TLS:-false}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-DC=company,DC=local}
      LDAP_DOMAIN: ${LDAP_DOMAIN:-company.local}
      LDAP_NETBIOS: ${LDAP_NETBIOS:-}
      LDAP_LOGIN_ATTR: ${LDAP_LOGIN_ATTR:-sAMAccountName}
      LDAP_AUTH_MECHANISM: ${LDAP_AUTH_MECHANISM:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_ADMIN_GROUP: ${LDAP_ADMIN_GROUP:-}
      LDAP_REQUIRED_GROUP: ${LDAP_REQUIRED_GROUP:-}
      LDAP_TIMEOUT: ${LDAP_TIMEOUT:-8}
      LDAP_SYNC_GROUPS: ${LDAP_SYNC_GROUPS:-true}
      LDAP_GROUP_BASE_DN: ${LDAP_GROUP_BASE_DN:-}
      LDAP_GROUP_FILTER: ${LDAP_GROUP_FILTER:-}
      LDAP_GROUP_EXCLUDE: ${LDAP_GROUP_EXCLUDE:-Domain Users,Domain Computers,Domain Guests}
      # ---- Call control / Yeastar + IP phones ----
      CALL_CONTROL_MODE: ${CALL_CONTROL_MODE:-ami}
      YEASTAR_ENABLED: ${YEASTAR_ENABLED:-false}
      YEASTAR_BASE_URL: ${YEASTAR_BASE_URL:-https://192.168.30.1:8088}
      YEASTAR_API_PATH: ${YEASTAR_API_PATH:-openapi/v1.0}
      YEASTAR_USERNAME: ${YEASTAR_USERNAME:-}
      YEASTAR_PASSWORD: ${YEASTAR_PASSWORD:-}
      YEASTAR_VERIFY_SSL: ${YEASTAR_VERIFY_SSL:-false}
      YEASTAR_TIMEOUT: ${YEASTAR_TIMEOUT:-8}
      YEASTAR_AUTO_ANSWER: ${YEASTAR_AUTO_ANSWER:-yes}
      YEASTAR_DIAL_PERMISSION: ${YEASTAR_DIAL_PERMISSION:-}
      PHONE_CONTROL_ENABLED: ${PHONE_CONTROL_ENABLED:-false}
      PHONE_CONTROL_USERNAME: ${PHONE_CONTROL_USERNAME:-}
      PHONE_CONTROL_PASSWORD: ${PHONE_CONTROL_PASSWORD:-}
      PHONE_CONTROL_TIMEOUT: ${PHONE_CONTROL_TIMEOUT:-4}
      PHONE_CONTROL_MAP: ${PHONE_CONTROL_MAP:-}
      PHONE_CONTROL_SCHEME: ${PHONE_CONTROL_SCHEME:-http}
      PHONE_CONTROL_DIAL_URL_TEMPLATE: ${PHONE_CONTROL_DIAL_URL_TEMPLATE:-{scheme}://{ip}/cgi-bin/ConfigManApp.com?key={to}}
      PHONE_CONTROL_FALLBACK_AMI: ${PHONE_CONTROL_FALLBACK_AMI:-true}
      PHONE_CONTROL_AD_ENABLED: ${PHONE_CONTROL_AD_ENABLED:-false}
      PHONE_CONTROL_AD_EXTENSION_ATTRS: ${PHONE_CONTROL_AD_EXTENSION_ATTRS:-telephoneNumber,ipPhone,otherTelephone}
      PHONE_CONTROL_AD_IP_ATTRS: ${PHONE_CONTROL_AD_IP_ATTRS:-ipPhone,networkAddress,description,info,extensionAttribute1,extensionAttribute2,extensionAttribute3}
      PHONE_CONTROL_ASTERISK_CONTACTS_ENABLED: ${PHONE_CONTROL_ASTERISK_CONTACTS_ENABLED:-true}
      PHONE_CONTROL_ASTERISK_CONTACT_COMMANDS: ${PHONE_CONTROL_ASTERISK_CONTACT_COMMANDS:-pjsip show contacts;sip show peers}
      # Legacy Fanvil aliases; keep for old .env files.
      FANVIL_ENABLED: ${FANVIL_ENABLED:-false}
      FANVIL_USERNAME: ${FANVIL_USERNAME:-}
      FANVIL_PASSWORD: ${FANVIL_PASSWORD:-}
      FANVIL_TIMEOUT: ${FANVIL_TIMEOUT:-4}
      FANVIL_PHONE_MAP: ${FANVIL_PHONE_MAP:-}
      FANVIL_SCHEME: ${FANVIL_SCHEME:-http}
      FANVIL_DIAL_URL_TEMPLATE: ${FANVIL_DIAL_URL_TEMPLATE:-{scheme}://{ip}/cgi-bin/ConfigManApp.com?key={to}}
      FANVIL_FALLBACK_AMI: ${FANVIL_FALLBACK_AMI:-true}
      # ---- Asterisk AMI / IP PBX ----
      AMI_ENABLED: ${AMI_ENABLED:-false}
      AMI_HOST: ${AMI_HOST:-192.168.30.1}
      AMI_PORT: ${AMI_PORT:-5038}
      AMI_USERNAME: ${AMI_USERNAME:-}
      AMI_SECRET: ${AMI_SECRET:-}
      AMI_RECONNECT_SECONDS: ${AMI_RECONNECT_SECONDS:-5}
      AMI_DEBUG_EVENTS: ${AMI_DEBUG_EVENTS:-false}
      AMI_ORIGINATE_CHANNEL_TEMPLATE: ${AMI_ORIGINATE_CHANNEL_TEMPLATE:-PJSIP/{ext}}
      AMI_ORIGINATE_CONTEXT: ${AMI_ORIGINATE_CONTEXT:-from-internal}
      AMI_ORIGINATE_CONTEXT_TEMPLATE: ${AMI_ORIGINATE_CONTEXT_TEMPLATE:-DLPN_DialPlan{from_ext}}
      AMI_ORIGINATE_DIAL_FALLBACK: ${AMI_ORIGINATE_DIAL_FALLBACK:-false}
      AMI_ORIGINATE_PRIORITY: ${AMI_ORIGINATE_PRIORITY:-1}
      AMI_ORIGINATE_TIMEOUT_MS: ${AMI_ORIGINATE_TIMEOUT_MS:-30000}
      # ---- SSO (NTLM / Kerberos / Reverse Proxy) ----
      SSO_ENABLED: ${SSO_ENABLED:-false}
      SSO_ALLOW_PROXY: ${SSO_ALLOW_PROXY:-true}
      SSO_ALLOW_NEGOTIATE: ${SSO_ALLOW_NEGOTIATE:-true}
      SSO_SERVICE_NAME: ${SSO_SERVICE_NAME:-HTTP/chat.kupava.by@KUPAVA.BY}
      SSO_KEYTAB_PATH: ${SSO_KEYTAB_PATH:-/etc/krb5.keytab}
      KRB5_KTNAME: FILE:${SSO_KEYTAB_PATH:-/etc/krb5.keytab}
      KRB5_CONFIG: /etc/krb5.conf
      # ---- Uploads ----
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
    volumes:
      - uploads:/app/uploads
      - ./krb5.keytab:/etc/krb5.keytab
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ccnet]

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        CACHEBUST: 1
    container_name: cc_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy   # <-- waits for a READY backend => no 502
    volumes:
      - uploads:/usr/share/nginx/uploads:ro
      - ./desktop-updates:/usr/share/nginx/html/desktop-updates:ro
    networks: [ccnet]

volumes:
  pgdata:
  uploads:

networks:
  ccnet:
    driver: bridge
